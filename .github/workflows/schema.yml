name: schema

on:
  push:
    paths:
      - "docs/schema/**"
      - ".github/workflows/schema.yml"
  pull_request:
    paths:
      - "docs/schema/**"
      - ".github/workflows/schema.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load schemas and fixtures
        run: python3 docs/schema/check_schemas.py
