[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oaep"
dynamic = ["version"]
description = "Open Agent Execution Protocol — verify cryptographic receipts for autonomous AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Antiserum contributors" }]
keywords = ["oaep", "agent", "receipt", "verification", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jsonschema>=4.18",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
oaep = "oaep.cli:entry"

[project.urls]
Homepage = "https://antiserum-ai.github.io/oaep/"
Documentation = "https://antiserum-ai.github.io/oaep/"
Repository = "https://github.com/antiserum-ai/oaep"
Issues = "https://github.com/antiserum-ai/oaep/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oaep = ["schema/*.json"]

[tool.setuptools.dynamic]
version = { attr = "oaep.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
